<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online SUMO E314</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#f6f6f4; --paneel:#fff; --tekst:#1d1d1b; --zacht:#6b6b66; --lijn:#e2e2dd; --accent:#1d1d1b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --paneel:#1f1f1d; --tekst:#ececea; --zacht:#9a9a94; --lijn:#33332f; --accent:#ececea; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--tekst); }
  header { position:sticky; top:0; z-index:2000; background:var(--paneel); border-bottom:1px solid var(--lijn);
           padding:10px 16px; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .klok { font-variant-numeric:tabular-nums; font-size:28px; font-weight:600; min-width:90px; }
  .bedien { display:flex; gap:8px; align-items:center; flex:1; min-width:260px; }
  .bedien input[type=range] { flex:1; accent-color:var(--accent); }
  button, select { font:inherit; background:var(--paneel); color:var(--tekst); border:1px solid var(--lijn);
                   border-radius:6px; padding:5px 10px; cursor:pointer; }
  button.aan { background:var(--tekst); color:var(--paneel); }
  main { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width:1000px) { main { grid-template-columns:1fr; } }
  .paneel { background:var(--paneel); border:1px solid var(--lijn); border-radius:10px; padding:12px 14px; }
  .paneel h2 { font-size:14px; margin:0 0 8px; font-weight:600; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #kaart { height:640px; border-radius:8px; }
  .legende { display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--zacht); font-size:12px; margin-top:8px; }
  .schaal { width:180px; height:10px; border-radius:3px;
            background:linear-gradient(90deg,#7a0019,#d7301f 17%,#fc8d59 42%,#fee08b 63%,#d9ef8b 80%,#1a9850); }
  .badge { font-size:11px; font-weight:500; padding:2px 8px; border-radius:99px; border:1px solid var(--lijn); color:var(--zacht); }
  .badge.open { background:#1a9850; color:#fff; border-color:#1a9850; }
  .hm { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hm figure { margin:0; }
  .hm figcaption { font-size:12px; color:var(--zacht); margin-bottom:2px; }
  canvas { width:100%; display:block; cursor:crosshair; }
  .kpi { display:flex; gap:18px; flex-wrap:wrap; margin:6px 0 2px; font-size:12px; color:var(--zacht); }
  .kpi b { display:block; font-size:18px; color:var(--tekst); font-variant-numeric:tabular-nums; }
  .rechts { display:flex; flex-direction:column; gap:16px; }
  .uitleg { color:var(--zacht); font-size:12px; margin:4px 0 0; }
  #volg.aan { background:#d7301f; border-color:#d7301f; color:#fff; }
  .rss { display:flex; gap:1px; background:#111; padding:2px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.4); width:max-content; }
  .rss span { min-width:18px; height:18px; display:flex; align-items:center; justify-content:center;
              font:600 10px/1 system-ui, sans-serif; color:#fff; background:#222; border-radius:2px; }
  .rss span.v { background:#fff; color:#111; border:2px solid #d7301f; border-radius:50%; min-width:18px; }
  .rss span.x { color:#ff3b30; font-size:13px; }
  .rss span.p { color:#ffcc00; font-size:13px; }
  .rss span.g { color:#34c759; font-size:13px; }
  .rss span.leeg { background:#333; }
  .melding { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
             font:700 12px/1 system-ui; color:#fff; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .meldingen { margin:10px 0 0; padding:0; list-style:none; font-size:12px; }
  .meldingen li { display:flex; gap:8px; align-items:baseline; padding:3px 0; border-top:1px solid var(--lijn); }
  .meldingen b { min-width:86px; }
  .lagen { display:flex; gap:14px; font-size:12px; color:var(--zacht); margin-top:6px; }
  .leaflet-tooltip { font:12px/1.4 system-ui, sans-serif; }
</style>
</head>
<body>
<header>
  <h1 id="titel"></h1>
  <div class="klok" id="klok">--:--</div>
  <div class="bedien">
    <button id="speel" title="Afspelen (spatie)">▶</button>
    <input type="range" id="schuif" min="0" value="0">
    <select id="tempo" title="Afspeelsnelheid">
      <option value="400">1 min / 0,4 s</option><option value="150" selected>1 min / 0,15 s</option><option value="60">1 min / 0,06 s</option>
    </select>
  </div>
  <div id="livebalk" style="display:none;align-items:center;gap:8px">
    <button id="volg" class="aan" title="Automatisch naar de laatste minuut springen">● Live</button>
    <span class="badge" id="livestatus">wachten op data…</span>
  </div>
  <div>
    <button data-r="beide" class="aan">Beide richtingen</button>
    <button data-r="0">→ Leuven</button>
    <button data-r="1">→ Aarschot</button>
  </div>
</header>
<main>
  <section class="paneel">
    <h2>Snelheid per wegvak</h2>
    <div id="kaart"></div>
    <div class="legende">
      <span>0</span><div class="schaal"></div><span>120 km/u</span>
      <span>· brede rand = <b>gemeten</b> (MIV-lussen), smalle kern = <b>SUMO</b></span>
      <span>· grijs = geen data</span>
    </div>
    <div class="lagen">
      <label><input type="checkbox" id="toonRss" checked> rijstrooksignalisatie</label>
      <label><input type="checkbox" id="toonInc" checked> meldingen Verkeerscentrum</label>
    </div>
    <ul class="meldingen" id="meldingen"></ul>
  </section>
  <section class="rechts" id="richtingen">
    <div class="paneel" id="radiopaneel" style="display:none">
      <h2>Radiobericht <button id="kopieer" style="font-size:12px;padding:2px 8px">kopieer</button></h2>
      <p id="radio" style="font-size:16px;line-height:1.5;margin:0"></p>
      <p class="uitleg">Automatisch opgesteld uit de MIV-lussen (files &lt; 60 km/u over ≥ 1 km, verliestijd t.o.v. 115 km/u)
      en de DATEX-meldingen als oorzaak.</p>
    </div>
  </section>
</main>
<script>
let D = /*DATA*/null;
const LIVE = /*LIVE*/null;   // naam van het data.js-bestand in live-modus
if (!D && !LIVE) {
  document.body.innerHTML = '<div style="max-width:560px;margin:80px auto;padding:0 16px">' +
    '<h1 style="font-size:18px">Dit is het sjabloon, zonder data</h1>' +
    '<p>Maak een viewer met <code>python maak_viewer.py --tag &lt;run&gt;</code> en open ' +
    '<code>uit/viewer_&lt;run&gt;.html</code>, bijvoorbeeld <code>uit/viewer_demo.html</code>.</p></div>';
  throw new Error('viewer_sjabloon.html bevat geen data: open uit/viewer_<run>.html');
}
let T = 0, t = 0, spelen = null, filter = 'beide', volgen = !!LIVE, lagen = null, panelen = null, rssLagen = [], incLagen = [];

function kleur(v) {
  if (v === null || v === undefined) return '#9a9a94';
  const stops = [[0,[122,0,25]],[20,[215,48,31]],[50,[252,141,89]],[75,[254,224,139]],[95,[217,239,139]],[120,[26,152,80]]];
  v = Math.max(0, Math.min(120, v));
  for (let i = 1; i < stops.length; i++) {
    if (v <= stops[i][0]) {
      const [a, ca] = stops[i-1], [b, cb] = stops[i], f = (v - a) / (b - a);
      return `rgb(${ca.map((c, k) => Math.round(c + f * (cb[k] - c))).join(',')})`;
    }
  }
}

// ---------- kaart (GRB basiskaart grijs, Digitaal Vlaanderen)
const kaart = L.map('kaart', { zoomSnap: 0.25, minZoom: 9, scrollWheelZoom: false });
kaart.on('click', () => kaart.scrollWheelZoom.enable());   // pas na een klik zoomt het scrollwiel
kaart.on('mouseout', () => kaart.scrollWheelZoom.disable());
L.tileLayer('https://geo.api.vlaanderen.be/GRB/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=grb_bsk_grijs&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
  { maxZoom: 19, attribution: 'GRB © Digitaal Vlaanderen · MIV © AWV / Vlaams Verkeerscentrum' }).addTo(kaart);
function maakLagen() {
lagen = D.richtingen.map((R, ri) => {
  const groep = L.layerGroup().addTo(kaart);
  const segs = R.segmenten.map((ll, k) => {
    const buiten = L.polyline(ll, { weight: 10, opacity: 0.95, lineCap: 'butt' }).addTo(groep);
    const kern = L.polyline(ll, { weight: 3.5, opacity: 1, lineCap: 'butt' }).addTo(groep);
    buiten.bindTooltip('', { sticky: true }); kern.bindTooltip('', { sticky: true });
    return { buiten, kern, ll };
  });
  return { groep, segs };
});
kaart.fitBounds(L.featureGroup(lagen.flatMap(l => l.segs.map(s => s.buiten))).getBounds(), { padding: [20, 20] });
}

// elke rijrichting enkele pixels naar rechts (t.o.v. de rijrichting) verschuiven, zodat beide zichtbaar zijn
function verschuif(ll, px) {
  const p = ll.map(q => kaart.latLngToLayerPoint(q));
  return p.map((q, i) => {
    const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, n = Math.hypot(dx, dy) || 1;
    return kaart.layerPointToLatLng(L.point(q.x - dy / n * px, q.y + dx / n * px));
  });
}
const KLEUR_MELDING = { ongeval: '#d7301f', file: '#7a0019', werken: '#e08a00', strookbeheer: '#6a3d9a', obstakel: '#555' };
const SYMBOOL_MELDING = { ongeval: '!', file: '≡', werken: 'W', strookbeheer: 'S', obstakel: '▲' };
function maakExtra() {
  rssLagen = (D.rss || []).map(p => {
    const m = L.marker(p.ll, { icon: L.divIcon({ className: '', html: '', iconSize: null }), zIndexOffset: 500 });
    m.bindTooltip('', { direction: 'top', offset: [0, -12] });
    return { p, m };
  });
  incLagen = (D.incidenten || []).map(i => {
    const kl = KLEUR_MELDING[i.soort] || '#333';
    const lijn = i.ll.length > 1 ? L.polyline(i.ll, { color: kl, weight: 4, dashArray: '6 5', opacity: 0.9 }) : null;
    const m = L.marker(i.ll[0], { icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11],
      html: `<div class="melding" style="background:${kl}">${SYMBOOL_MELDING[i.soort] || '?'}</div>` }), zIndexOffset: 1000 });
    m.bindTooltip(`<b>${i.soort}</b><br>${i.tekst}`);
    return { i, lijn, m };
  });
}
function rssHtml(beeld) {
  if (!beeld) return '<div class="rss"><span class="leeg">?</span></div>';
  return '<div class="rss">' + beeld.map(c => {
    const cls = /^\d+$/.test(c) ? 'v' : c === '✕' ? 'x' : (c === '↘' || c === '↙') ? 'p' : c === '↓' ? 'g' : c ? '' : 'leeg';
    return `<span class="${cls}">${c}</span>`;
  }).join('') + '</div>';
}
function tekenExtra() {
  const toonRss = document.getElementById('toonRss').checked, toonInc = document.getElementById('toonInc').checked;
  rssLagen.forEach(({ p, m }) => {
    const zicht = toonRss && (filter === 'beide' || D.richtingen[+filter].naam === p.richting);
    if (!zicht) { if (kaart.hasLayer(m)) kaart.removeLayer(m); return; }
    const b = p.beeld[t];
    const html = rssHtml(b);
    if (m._laatste !== html) { m.setIcon(L.divIcon({ className: '', html, iconSize: null, iconAnchor: [b ? b.length * 9.5 : 10, 11] })); m._laatste = html; }
    m.setTooltipContent(`Rijstrooksignalisatie km ${p.km} · richting ${p.richting}<br>stroken ${p.stroken.join(' ')}`);
    if (!kaart.hasLayer(m)) m.addTo(kaart);
  });
  const lijst = [];
  incLagen.forEach(({ i, lijn, m }) => {
    const aan = toonInc && i.actief[t];
    [lijn, m].forEach(l => { if (!l) return; if (aan && !kaart.hasLayer(l)) l.addTo(kaart); if (!aan && kaart.hasLayer(l)) kaart.removeLayer(l); });
    if (i.actief[t]) lijst.push(`<li><b style="color:${KLEUR_MELDING[i.soort] || 'inherit'}">${i.soort}</b><span>${i.tekst}</span></li>`);
  });
  document.getElementById('meldingen').innerHTML = lijst.length
    ? `<li><b>Meldingen</b><span>actief om ${D.tijden[t]} binnen 400 m van de corridor</span></li>` + lijst.join('')
    : '<li><b>Meldingen</b><span>geen actieve melding</span></li>';
}
function legLijnen() {
  if (!lagen) return;
  const px = filter === 'beide' ? 6 : 0;
  lagen.forEach(l => l.segs.forEach(s => { const v = verschuif(s.ll, px); s.buiten.setLatLngs(v); s.kern.setLatLngs(v); }));
}
kaart.on('zoomend', legLijnen);

function tekenKaart() {
  tekenExtra();
  D.richtingen.forEach((R, ri) => {
    const zicht = filter === 'beide' || +filter === ri;
    if (zicht && !kaart.hasLayer(lagen[ri].groep)) lagen[ri].groep.addTo(kaart);
    if (!zicht && kaart.hasLayer(lagen[ri].groep)) kaart.removeLayer(lagen[ri].groep);
    lagen[ri].segs.forEach((s, k) => {
      const vm = R.vm[t][k], vs = R.vs[t][k], qm = R.qm[t][k], qs = R.qs[t][k];
      s.buiten.setStyle({ color: kleur(vm) });
      s.kern.setStyle({ color: kleur(vs) });
      const d = R.doorsneden[k];
      const html = `<b>${d.naam}</b> · richting ${R.naam}<br>` +
        `gemeten: ${vm ?? '–'} km/u · ${qm ?? '–'} vtg/u<br>SUMO: ${vs ?? '–'} km/u · ${qs ?? '–'} vtg/u`;
      s.buiten.setTooltipContent(html); s.kern.setTooltipContent(html);
    });
  });
}

// ---------- panelen per richting
function maakPanelen() {
panelen = D.richtingen.map((R, ri) => {
  const el = document.createElement('div');
  el.className = 'paneel';
  el.innerHTML = `<h2>Richting ${R.naam} <span class="badge" id="sp${ri}">spitsstrook</span></h2>
    <div class="kpi">
      <div>reistijd gemeten<b id="ttm${ri}">–</b></div>
      <div>reistijd SUMO<b id="tts${ri}">–</b></div>
      <div>traagste punt gemeten<b id="minm${ri}">–</b></div>
      <div>traagste punt SUMO<b id="mins${ri}">–</b></div>
    </div>
    <div class="hm">
      <figure><figcaption>gemeten – tijd × plaats</figcaption><canvas id="hmm${ri}" height="260"></canvas></figure>
      <figure><figcaption>SUMO – tijd × plaats</figcaption><canvas id="hms${ri}" height="260"></canvas></figure>
    </div>
    <canvas id="tt${ri}" height="120" style="margin-top:8px"></canvas>
    <p class="uitleg">Verticaal: km stroomafwaarts (onderaan = begin model). Klik in een diagram om naar dat tijdstip te gaan.
    Reistijd = momentane reistijd uit de lussnelheden over ${R.doorsneden[0].x}–${R.doorsneden.at(-1).x} km.</p>`;
  document.getElementById('richtingen').appendChild(el);
  return el;
});
}

function schaalCanvas(c) {
  const r = window.devicePixelRatio || 1, w = c.clientWidth, h = c.height / (c._r || 1);
  if (c._w !== w) { c._r = r; c._h = h; c.width = w * r; c.height = h * r; c._w = w; }
  const ctx = c.getContext('2d'); ctx.setTransform(r, 0, 0, r, 0, 0); return [ctx, w, c._h];
}

const LINKS = 4, ONDER = 16;
function tekenHeatmap(c, R, V, achtergrond) {
  if (!c._beeld || c._w !== c.clientWidth) {
    const [ctx, w, h] = schaalCanvas(c);
    const xs = R.doorsneden.map(d => d.x), x0 = xs[0], x1 = xs.at(-1);
    const H = h - ONDER, W = w - LINKS, bw = W / T;
    ctx.clearRect(0, 0, w, h);
    const grenzen = [x0, ...xs.slice(1).map((x, k) => (x + xs[k]) / 2), x1];
    for (let i = 0; i < T; i++) for (let k = 0; k < xs.length; k++) {
      const ya = H - (grenzen[k] - x0) / (x1 - x0) * H, yb = H - (grenzen[k + 1] - x0) / (x1 - x0) * H;
      ctx.fillStyle = kleur(V[i][k]); ctx.fillRect(LINKS + i * bw, yb, Math.ceil(bw) + 0.5, ya - yb + 0.5);
    }
    // complexen
    ctx.font = '10px system-ui'; ctx.fillStyle = getComputedStyle(document.body).color;
    const gezien = new Set();
    R.ramps.filter(r => r.soort === 'af').forEach(r => {
      const naam = r.naam;
      if (gezien.has(naam) || r.x < x0 || r.x > x1) return; gezien.add(naam);
      const y = H - (r.x - x0) / (x1 - x0) * H;
      ctx.globalAlpha = 0.35; ctx.fillRect(LINKS, y, W, 1); ctx.globalAlpha = 0.85;
      ctx.fillText(naam, LINKS + 3, y - 2); ctx.globalAlpha = 1;
    });
    // tijdas
    ctx.fillStyle = getComputedStyle(document.body).color; ctx.globalAlpha = 0.7;
    const maxLabels = Math.max(2, Math.floor(W / 42));
    const stap = [1, 2, 5, 10, 15, 30, 60, 120].find(s => T / s <= maxLabels) || 120;
    for (let i = 0; i < T; i++) {
      const [hh, mm] = D.tijden[i].split(':').map(Number);
      if ((hh * 60 + mm) % stap === 0) { ctx.fillRect(LINKS + i * bw, H, 1, 3); ctx.fillText(D.tijden[i], LINKS + i * bw + 2, h - 3); }
    }
    ctx.globalAlpha = 1;
    c._beeld = ctx.getImageData(0, 0, c.width, c.height);
    c.onclick = e => { const r = c.getBoundingClientRect(); zet(Math.floor((e.clientX - r.left - LINKS) / (r.width - LINKS) * T)); };
  }
  const ctx = c.getContext('2d'); ctx.putImageData(c._beeld, 0, 0);
  const w = c._w, H = c._h - ONDER, x = LINKS + (t + 0.5) * (w - LINKS) / T;
  ctx.fillStyle = '#000'; ctx.fillRect(x - 1, 0, 2, H); ctx.fillStyle = '#fff'; ctx.fillRect(x - 0.5, 0, 1, H);
}

function tekenReistijd(c, R) {
  const [ctx, w, h] = schaalCanvas(c);
  ctx.clearRect(0, 0, w, h);
  const alle = [...R.ttm, ...R.tts].filter(v => v !== null);
  const lo = Math.floor(Math.min(...alle) - 0.5), hi = Math.ceil(Math.max(...alle) + 0.5);
  const L0 = 34, H = h - 18, W = w - L0 - 4;
  const kl = getComputedStyle(document.body).color;
  ctx.font = '10px system-ui'; ctx.fillStyle = kl; ctx.globalAlpha = 0.6;
  for (let v = lo; v <= hi; v += Math.max(1, Math.round((hi - lo) / 4))) {
    const y = H - (v - lo) / (hi - lo) * H; ctx.fillText(v + "'", 2, y + 3); ctx.fillRect(L0, y, W, 0.5);
  }
  ctx.globalAlpha = 1;
  [[R.ttm, kl, 'gemeten'], [R.tts, '#d7301f', 'SUMO']].forEach(([s, kleurL, lbl], j) => {
    ctx.strokeStyle = kleurL; ctx.lineWidth = 1.8; ctx.beginPath(); let start = true;
    s.forEach((v, i) => { if (v === null) { start = true; return; }
      const x = L0 + i / Math.max(1, T - 1) * W, y = H - (v - lo) / (hi - lo) * H;
      start ? ctx.moveTo(x, y) : ctx.lineTo(x, y); start = false; });
    ctx.stroke(); ctx.fillStyle = kleurL; ctx.fillText('— ' + lbl, L0 + 6 + j * 70, h - 4);
  });
  const x = L0 + t / Math.max(1, T - 1) * W; ctx.fillStyle = kl; ctx.globalAlpha = 0.5; ctx.fillRect(x, 0, 1, H); ctx.globalAlpha = 1;
  c.onclick = e => { const r = c.getBoundingClientRect(); zet(Math.round((e.clientX - r.left - L0) / W * (T - 1))); };
}

function minPunt(R, V) {
  let best = null;
  V[t].forEach((v, k) => { if (v !== null && (best === null || v < best[0])) best = [v, R.doorsneden[k].naam]; });
  return best ? `${best[0]} km/u` : '–';
}

function teken() {
  if (!T) return;
  if (D.radio) {
    document.getElementById('radiopaneel').style.display = '';
    document.getElementById('radio').textContent = D.radio[t] || '';
  }
  document.getElementById('klok').textContent = D.tijden[t];
  document.getElementById('schuif').value = t;
  tekenKaart();
  D.richtingen.forEach((R, ri) => {
    const zicht = filter === 'beide' || +filter === ri;
    panelen[ri].style.display = zicht ? '' : 'none';
    if (!zicht) return;
    tekenHeatmap(document.getElementById('hmm' + ri), R, R.vm);
    tekenHeatmap(document.getElementById('hms' + ri), R, R.vs);
    tekenReistijd(document.getElementById('tt' + ri), R);
    const f = v => v === null ? '–' : v.toFixed(1) + ' min';
    document.getElementById('ttm' + ri).textContent = f(R.ttm[t]);
    document.getElementById('tts' + ri).textContent = f(R.tts[t]);
    document.getElementById('minm' + ri).textContent = minPunt(R, R.vm);
    document.getElementById('mins' + ri).textContent = minPunt(R, R.vs);
    const sp = document.getElementById('sp' + ri), open = R.spits.length ? R.spits[t] : null;
    sp.textContent = open === null ? 'spitsstrook ?' : open ? 'spitsstrook open' : 'spitsstrook dicht';
    sp.classList.toggle('open', !!open);
  });
}
function zet(i) { t = Math.max(0, Math.min(T - 1, i)); teken(); }

const schuif = document.getElementById('schuif');
schuif.oninput = () => { zetVolgen(false); zet(+schuif.value); };
const knop = document.getElementById('speel');
function speel() {
  zetVolgen(false);
  if (spelen) { clearInterval(spelen); spelen = null; knop.textContent = '▶'; return; }
  if (t >= T - 1) t = 0;
  knop.textContent = '❚❚';
  spelen = setInterval(() => { if (t >= T - 1) return speel(); zet(t + 1); }, +document.getElementById('tempo').value);
}
knop.onclick = speel;
document.getElementById('tempo').onchange = () => { if (spelen) { speel(); speel(); } };
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); speel(); }
  if (e.code === 'ArrowRight') zet(t + 1);
  if (e.code === 'ArrowLeft') { zetVolgen(false); zet(t - 1); }
});
document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
  filter = b.dataset.r;
  document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('aan', x === b));
  document.querySelectorAll('canvas').forEach(c => c._beeld = null);
  legLijnen();
  teken();
});
document.getElementById('kopieer').onclick = () => {
  const k = document.getElementById('kopieer');
  navigator.clipboard.writeText(document.getElementById('radio').textContent)
    .then(() => { k.textContent = 'gekopieerd'; setTimeout(() => k.textContent = 'kopieer', 1500); })
    .catch(() => { k.textContent = 'niet gelukt'; });
};
['toonRss', 'toonInc'].forEach(id => document.getElementById(id).onchange = () => teken());
window.addEventListener('resize', () => { document.querySelectorAll('canvas').forEach(c => c._beeld = null); teken(); });

// ---------- data laden: ingebed (vaste viewer) of telkens opnieuw uit data.js (live)
function laad(nieuw) {
  if (!nieuw || !nieuw.tijden.length) return;
  const eerste = !lagen;
  D = nieuw; T = D.tijden.length;
  if (eerste) { document.getElementById('titel').textContent = D.titel; maakLagen(); legLijnen(); maakPanelen(); }
  // borden en meldingen kunnen bij elke update veranderen (nieuwe melding): telkens opnieuw opbouwen
  rssLagen.forEach(({ m }) => kaart.removeLayer(m)); incLagen.forEach(({ lijn, m }) => { if (lijn) kaart.removeLayer(lijn); kaart.removeLayer(m); });
  maakExtra();
  schuif.max = T - 1;
  document.querySelectorAll('canvas').forEach(c => c._beeld = null);
  zet(volgen || eerste && LIVE ? T - 1 : Math.min(t, T - 1));
}
function zetVolgen(aan) {
  if (!LIVE) return;
  volgen = aan;
  document.getElementById('volg').classList.toggle('aan', aan);
  if (aan) zet(T - 1);
}
if (!LIVE) laad(D);
else {
  document.getElementById('livebalk').style.display = 'flex';
  document.getElementById('volg').onclick = () => zetVolgen(!volgen);
  const status = document.getElementById('livestatus');
  let timer = null;
  const haal = () => {
    const s = document.createElement('script');   // <script> werkt ook bij openen via file://, fetch niet
    s.src = LIVE + '?t=' + Date.now();
    s.onload = () => {
      s.remove();
      const nieuw = window.VIEWER_DATA;
      if (!nieuw) return;
      if (!D || nieuw.bijgewerkt !== D.bijgewerkt) laad(nieuw);
      status.textContent = nieuw.live ? `bijgewerkt ${nieuw.bijgewerkt} · t/m ${nieuw.tijden.at(-1) ?? '–'}`
                                      : `run afgerond · t/m ${nieuw.tijden.at(-1)}`;
      if (!nieuw.live) { clearInterval(timer); document.getElementById('volg').textContent = '■ Afgerond'; }
    };
    s.onerror = () => { s.remove(); status.textContent = 'nog geen data (draait maak_viewer.py --live?)'; };
    document.head.appendChild(s);
  };
  haal();
  timer = setInterval(haal, 20000);
}
</script>
